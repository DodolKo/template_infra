[databases]
* = host=melchior_db port=5432 dbname=app_db user=root password=root

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = root
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 30
min_pool_size = 5
reserve_pool_size = 10
